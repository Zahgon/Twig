name: "CI"

on:
    pull_request:
    push:

permissions:
  contents: read

jobs:
    tests:
        name: "Go ${{ matrix.go-version }}"

        runs-on: 'ubuntu-latest'

        strategy:
            matrix:
                go-version:
                    - '1.23'
                    - 'stable'

        steps:
            - name: "Checkout code"
              uses: actions/checkout@v4

            - name: "Install Go"
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ matrix.go-version }}

            - name: "Check formatting"
              run: test -z "$(gofmt -l .)"

            - name: "Vet"
              run: go vet ./...

            - name: "Build the twig command"
              run: CGO_ENABLED=0 go build -o twig ./cmd/twig

            - name: "Run tests"
              run: go test ./...
